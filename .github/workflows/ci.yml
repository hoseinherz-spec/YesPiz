name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build --workspace=@repo/i18n
      - run: npm run lint
      - run: npm run check-types
      - run: npm test
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build --workspace=@repo/i18n
      - run: npm run test:e2e --workspace=api -- --runInBand --watchman=false
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build --workspace=@repo/i18n
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:admin
      - run: npm run test:e2e:features
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            test-results
            playwright-report
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, mobile, courier-mobile, provider-panel, admin, website]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build --workspace=@repo/i18n
      - if: matrix.app == 'api'
        run: npm run build --workspace=api
      - if: matrix.app != 'api'
        run: npm exec --workspace=${{ matrix.app }} -- next build --webpack
