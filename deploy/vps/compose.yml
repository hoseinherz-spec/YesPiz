name: yespizz
x-app: &app
  image: yespizz-runtime:latest
  restart: unless-stopped
  mem_limit: 512m
  logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
services:
  mongo:
    image: mongo:7
    command: [mongod, --wiredTigerCacheSizeGB, '0.25']
    restart: unless-stopped
    mem_limit: 512m
    volumes: [mongo:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'db.adminCommand({ping:1}).ok']
      interval: 15s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 64mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    mem_limit: 128m
    volumes: [redis:/data]
  storage:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    restart: unless-stopped
    mem_limit: 384m
    env_file: .env
    ports: ['8059:9000']
    volumes: [storage:/data]
  api:
    <<: *app
    image: yespizz-api:latest
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '8058'
      MONGODB_URI: mongodb://mongo:27017/yespizz
      REDIS_URL: redis://redis:6379
    ports: ['8058:8058']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:8058/api/v1/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 20s
      timeout: 5s
      retries: 5
  website:
    <<: *app
    image: yespizz-website:latest
    command: [npm, run, start, --workspace=website]
    ports: ['8050:8050']
  admin:
    <<: *app
    image: yespizz-admin:latest
    command: [npm, run, start, --workspace=admin]
    ports: ['8052:8052']
  kitchen:
    <<: *app
    command: [npm, run, start, --workspace=provider-panel]
    ports: ['8084:8084']
  gateway:
    image: yespizz-gateway:latest
    restart: unless-stopped
    mem_limit: 64m
    ports: ['8051:8051', '8053:8053']
    volumes: ['../../media/toppings:/srv/topping-media:ro']
volumes:
  mongo:
  redis:
  storage:
