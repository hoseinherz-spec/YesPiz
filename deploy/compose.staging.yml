name: yespizz-staging
x-web-args: &web-args
  NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
  NEXT_PUBLIC_APPLE_CLIENT_ID: ${NEXT_PUBLIC_APPLE_CLIENT_ID:-}
  NEXT_PUBLIC_APPLE_REDIRECT_URI: ${NEXT_PUBLIC_APPLE_REDIRECT_URI:-}
  NEXT_PUBLIC_FIREBASE_CONFIG: ${NEXT_PUBLIC_FIREBASE_CONFIG:-}
  NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
  NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
  NEXT_PUBLIC_SERVICE_AREA_LATITUDE: ${SERVICE_AREA_LATITUDE:?Set service area}
  NEXT_PUBLIC_SERVICE_AREA_LONGITUDE: ${SERVICE_AREA_LONGITUDE:?Set service area}
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes: [mongo:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    restart: unless-stopped
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    env_file: .env.staging
    environment:
      NODE_ENV: production
      PORT: "8058"
      MONGODB_URI: mongodb://mongo:27017/yespizz_staging
      REDIS_URL: redis://redis:6379
    ports: ["127.0.0.1:8058:8058"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://localhost:8058/api/v1/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
  customer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: static
      args: { <<: *web-args, APP: mobile }
    restart: unless-stopped
    ports: ["127.0.0.1:8051:80"]
  courier:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: static
      args: { <<: *web-args, APP: courier-mobile }
    restart: unless-stopped
    ports: ["127.0.0.1:8053:80"]
  kitchen:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: server
      args: { <<: *web-args, APP: provider-panel }
    restart: unless-stopped
    ports: ["127.0.0.1:8084:8084"]
  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: server
      args: { <<: *web-args, APP: admin }
    restart: unless-stopped
    ports: ["127.0.0.1:8052:8052"]
volumes:
  mongo:
  redis:
